<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeeaKuma Chat</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body class="background">
  <div class="chat-container glass-effect">
    <div class="chat-header">
      <strong>DeeaKuma</strong>
      <span>You: <span id="username"></span> <button onclick="logout()">Logout</button></span>
    </div>

    <div id="chatBox" class="chat-box glass-inner"></div>

    <div class="input-area glass-inner">
      <button id="emojiBtn" class="emoji-button">😀</button>
      <textarea id="messageInput" placeholder="Type your message..."></textarea>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
