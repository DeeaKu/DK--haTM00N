<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DeeaKuma Chat</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Emoji Picker -->
  <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.2/dist/index.min.js"></script>

  <style>
    /* ✅ Glass effect */
    .chat-container {
      width: 750px;
      height: 520px;
      margin: 50px auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      color: white;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 18px;
    }

    .status {
      font-size: 14px;
      color: #a0fba0;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      margin: 10px 0;
    }

    .chat-message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      position: relative;
      word-wrap: break-word;
      max-width: 75%;
    }

    .chat-message.self {
      background: rgba(0, 122, 255, 0.6);
      margin-left: auto;
    }

    .chat-message.other {
      background: rgba(0, 0, 0, 0.5);
      margin-right: auto;
    }

    .message-menu {
      position: absolute;
      top: -35px;
      right: 5px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      display: flex;
      gap: 8px;
      padding: 5px 8px;
      font-size: 14px;
      display: none;
    }

    .message-menu button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .typing {
      font-size: 14px;
      color: #ffb6c1;
      text-align: left;
      height: 20px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    #messageInput {
      flex: 1;
      resize: none;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    #emojiBtn {
      font-size: 22px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    button.send-btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
    }

  </style>
</head>

<body class="background">
  <div class="chat-container">
    <div class="chat-header">
      <strong>💬 DeeaKuma Chat</strong>
      <div>
        <span id="status" class="status">🟠 Checking...</span>
        <button onclick="logout()" style="margin-left:10px;">Logout</button>
      </div>
    </div>

    <div id="chatBox" class="chat-box"></div>

    <div class="typing" id="typingIndicator"></div>

    <div class="input-area">
      <button id="emojiBtn">😀</button>
      <textarea id="messageInput" placeholder="Type a message..." rows="2"></textarea>
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let currentUser;
    let typingTimeout;

    // 🔥 Check auth
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        currentUser = user;
        initChat();
      }
    });

    function initChat() {
      const db = firebase.database();

      // ✅ Online status
      const userStatusRef = db.ref('/status/' + currentUser.uid);
      const connectedRef = db.ref('.info/connected');

      connectedRef.on('value', snap => {
        if (snap.val() === false) return;
        userStatusRef.onDisconnect().set({ online: false, lastSeen: Date.now() });
        userStatusRef.set({ online: true, lastSeen: Date.now() });
      });

      // Show online/offline
      db.ref('/status/').on('value', snapshot => {
        const users = snapshot.val() || {};
        let anyOnline = false;
        for (let id in users) {
          if (users[id].online && id !== currentUser.uid) anyOnline = true;
        }
        document.getElementById("status").innerText = anyOnline ? "🟢 Online" : "🔴 Offline";
      });

      // ✅ Load chat messages
      loadMessages();

      // ✅ Typing indicator
      const typingRef = db.ref('/typing/' + currentUser.uid);
      const otherTypingRef = db.ref('/typing/');
      const typingIndicator = document.getElementById('typingIndicator');

      document.getElementById('messageInput').addEventListener('input', () => {
        typingRef.set({ typing: true, user: currentUser.email });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => typingRef.set({ typing: false, user: currentUser.email }), 2000);
      });

      otherTypingRef.on('value', snapshot => {
        let someoneTyping = false;
        snapshot.forEach(child => {
          const data = child.val();
          if (data.typing && child.key !== currentUser.uid) {
            typingIndicator.innerText = `${data.user.split('@')[0]} is typing...`;
            someoneTyping = true;
          }
        });
        if (!someoneTyping) typingIndicator.innerText = "";
      });
    }

    // ✅ Load messages
    function loadMessages() {
      const chatRef = firebase.database().ref("messages");
      chatRef.on("value", snapshot => {
        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML = "";
        snapshot.forEach(child => {
          const data = child.val();
          const div = document.createElement("div");
          div.classList.add("chat-message");
          if (data.user === currentUser.email) div.classList.add("self");
          else div.classList.add("other");

          div.innerHTML = `
            <strong>${data.user.split('@')[0]}</strong><br>
            <span class="text">${data.message}</span><br>
            <small>${new Date(data.timestamp).toLocaleTimeString()}</small>
            <div class="message-menu">
              ${data.user === currentUser.email
                ? `<button onclick="editMessage('${child.key}', '${data.message.replace(/'/g, "\\'")}')">✏️</button>
                   <button onclick="deleteMessage('${child.key}')">🗑️</button>`
                : ''}
              <button onclick="copyMessage('${data.message.replace(/'/g, "\\'")}')">📋</button>
              <button onclick="likeMessage('${child.key}')">❤️</button>
            </div>
          `;

          div.addEventListener('click', e => {
            e.stopPropagation();
            document.querySelectorAll('.message-menu').forEach(m => m.style.display = 'none');
            div.querySelector('.message-menu').style.display = 'flex';
          });

          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      document.addEventListener('click', () => {
        document.querySelectorAll('.message-menu').forEach(m => m.style.display = 'none');
      });
    }

    // ✅ Actions
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();
      if (!message) return;
      firebase.database().ref("messages").push({
        user: currentUser.email,
        message: message,
        timestamp: new Date().toISOString()
      });
      input.value = "";
    }

    function deleteMessage(key) {
      firebase.database().ref("messages/" + key).remove();
    }

    function editMessage(key, oldMessage) {
      const newMsg = prompt("Edit your message:", oldMessage);
      if (newMsg !== null) {
        firebase.database().ref("messages/" + key).update({ message: newMsg });
      }
    }

    function copyMessage(msg) {
      navigator.clipboard.writeText(msg);
      alert("Message copied!");
    }

    function likeMessage(key) {
      const ref = firebase.database().ref("messages/" + key + "/likes");
      ref.transaction(likes => (likes || 0) + 1);
    }

    function logout() {
      firebase.auth().signOut().then(() => window.location.href = "index.html");
    }

    // ✅ Emoji picker
    document.addEventListener("DOMContentLoaded", () => {
      const emojiBtn = document.querySelector('#emojiBtn');
      const input = document.querySelector('#messageInput');
      const picker = new EmojiButton({ position: 'top-end', theme: 'dark' });
      let pickerVisible = false;

      emojiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        picker.togglePicker(emojiBtn);
        pickerVisible = !pickerVisible;
      });

      picker.on('emoji', emoji => {
        input.value += emoji;
        input.focus();
      });

      document.addEventListener('click', (e) => {
        if (pickerVisible && !emojiBtn.contains(e.target)) {
          picker.hidePicker();
          pickerVisible = false;
        }
      });
    });
  </script>
</body>
</html>
